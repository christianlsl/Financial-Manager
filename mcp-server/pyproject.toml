[project]
name = "financial-manager-mcp"
version = "0.1.0"
description = "MCP Server for Financial Manager - lets AI assistants query/modify data and generate invoices via the existing REST API"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.12,<2",
    "httpx>=0.27.0",
    "openpyxl>=3.1.2",
    "cryptography>=42.0.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
financial-mcp = "mcp_server.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mcp_server"]
