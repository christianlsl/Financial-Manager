services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./backend/config.yaml:/app/backend/config.yaml:ro
      - ./data:/app/backend/data
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "5678:5678"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
    depends_on:
      - backend
    restart: unless-stopped
