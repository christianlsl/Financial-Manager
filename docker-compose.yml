services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./backend/config.yaml:/app/backend/config.yaml:ro
      - ./data:/app/backend/data
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "5678:5678"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
    depends_on:
      - backend
    restart: unless-stopped

  mcp:
    build:
      context: .
      dockerfile: mcp-server/Dockerfile
    environment:
      - FM_API_BASE_URL=http://backend:9910
      - FM_MCP_TOKEN=${FM_MCP_TOKEN:-}
      - FM_MCP_HOST=0.0.0.0
      - FM_MCP_PORT=9911
      - FM_INVOICE_DIR=/app/invoices
    volumes:
      - ./data/invoices:/app/invoices
    ports:
      - "9911:9911"
    depends_on:
      - backend
    restart: unless-stopped
