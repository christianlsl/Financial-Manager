server {
    listen 5678;
    listen [::]:5678;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Vue Router history mode
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 反向代理后端 API（去掉 /api 前缀）
    location /api/ {
        proxy_pass http://backend:9910/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
